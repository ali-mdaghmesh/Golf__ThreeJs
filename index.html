<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>محاكاة غولف — فيزياء ثلاثية الأبعاد</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app"></div>

    <div id="ui-layer">
   


    <button type="button" id="btn-dashboard" class="fab" title="لوحة التحكم">⚙</button>

    <div id="dashboard-backdrop" class="backdrop"></div>

    <aside id="dashboard" class="panel">
      <header class="panel-head">
        <h2>لوحة التحكم</h2>
        <button type="button" id="dashboard-close" aria-label="إغلاق">×</button>
      </header>

      <section class="panel-section">
        <h3>الضربة</h3>
        <label>السرعة الابتدائية v₀ (م/ث) <span id="param-v0-val">23</span>
          <input type="range" id="param-v0" min="15" max="85" step="0.5" value="23" />
        </label>
        <label>زاوية الانطلاق θ (°) <span id="param-theta-val">8.1</span>
          <input type="range" id="param-theta" min="5" max="25" step="0.05" value="8.1" />
        </label>
        <label>انحراف جانبي vx₀ (م/ث) <span id="param-vz0-val">0</span>
          <input type="range" id="param-vz0" min="-10" max="10" step="0.5" value="0" />
        </label>
        <label>ωx (راد/ث) <span id="param-omegax-val">0</span>
          <input type="range" id="param-omegax" min="-60" max="60" step="5" value="0" />
        </label>
        <label>ωy جانبي (راد/ث) <span id="param-omegay-val">0</span>
          <input type="range" id="param-omegay" min="-90" max="90" step="5" value="0" />
        </label>
        <label>ωz خلفي (راد/ث) <span id="param-omegaz-val">91.5</span>
          <input type="range" id="param-omegaz" min="0" max="200" step="0.5" value="91.5" />
        </label>
        <label>موضع الإرسال X <span id="param-startX-val">0</span>
          <input type="range" id="param-startX" min="-40" max="40" step="1" value="0" />
        </label>
        <label>موضع الإرسال Z <span id="param-startZ-val">-41</span>
          <input type="range" id="param-startZ" min="-95" max="95" step="1" value="-41" />
        </label>
        <label>زاوية التصويب (°) <span id="param-aim-yaw-val">0</span>
          <input type="range" id="param-aim-yaw" min="-180" max="180" step="1" value="0" title="0° = نحو الحفرة" />
        </label>
        <div class="btn-row">
          <button type="button" id="btn-shoot" class="btn-primary" >إطلاق الكرة</button>
          <button type="button" id="btn-reset" class="btn-secondary">إعادة ضبط</button>
        </div>
      </section>

      <section class="panel-section">
        <h3>نوع الكرة</h3>
        <label class="check"><input type="checkbox" id="ball-dimpled" checked /> ذات تجاويف </label>
        <label class="check"><input type="checkbox" id="ball-smooth" /> ملساء </label>
      </section>

     
         <section class="panel-section">
        <label>نوع الأرض
            <select id="ground-type">
                <option value="shortGrass">عشب قصير</option>
                <option value="tallGrass">عشب طويل</option>
                <option value="sand">رمل</option>
            </select>
        </label>
      </section>
      
      <section class="panel-section">

        <h3>العرض والكاميرا</h3>
        <label class="check"><input type="checkbox" id="opt-trail" checked /> مسار الكرة</label>
        <label>وضع الكاميرا
          <select id="camera-mode">
            <option value="follow">متابعة</option>
            <option value="orbit">دوران</option>
            <option value="free">WASD</option>
          </select>
        </label>
      </section>

      <section class="panel-section stats" id="stats-readout"></section>
    </aside>



    <script type="module" src="/src/main.js"></script>
  </body>
</html>
